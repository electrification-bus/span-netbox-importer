name: Release

# Publish a GitHub Release when a version tag is pushed. The notes come from the
# matching CHANGELOG section:
#
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# Guards (each fails the run rather than publish a wrong release):
#   - the tag must equal "v" + __version__ in span-netbox-importer
#   - CHANGELOG.md must contain a "## [X.Y.Z]" section
#   - that section's date must be today (UTC), the actual release date
#
# Recovery when a guard fails: fix the file on main, then move the tag:
#   git tag -f vX.Y.Z && git push -f origin vX.Y.Z

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Tag must match __version__
        run: |
          VER=$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' span-netbox-importer)
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME != __version__ ($VER). Bump __version__ or move the tag."
            exit 1
          fi

      - name: Extract CHANGELOG notes and verify the release date
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          VER_ESC="${VER//./\\.}"
          START=$(grep -nE "^## \[${VER_ESC}\]" CHANGELOG.md | head -1 | cut -d: -f1 || true)
          if [ -z "${START:-}" ]; then
            echo "::error::No CHANGELOG section '## [$VER]' found."
            exit 1
          fi
          CL_DATE=$(sed -n "${START}p" CHANGELOG.md | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 || true)
          TODAY=$(date -u +%F)
          if [ "${CL_DATE:-}" != "$TODAY" ]; then
            echo "::error::CHANGELOG date for [$VER] is '${CL_DATE:-none}', expected today (UTC) '$TODAY'. Fix the date on main and move the tag."
            exit 1
          fi
          # Body = lines up to the next "## [" heading or the link references.
          REL=$(tail -n +$((START + 1)) CHANGELOG.md | grep -nE '^(## \[|\[[^]]+\]: )' | head -1 | cut -d: -f1 || true)
          if [ -n "${REL:-}" ]; then
            sed -n "$((START + 1)),$((START + REL - 1))p" CHANGELOG.md > NOTES.md
          else
            sed -n "$((START + 1)),\$p" CHANGELOG.md > NOTES.md
          fi
          # Trim leading and trailing blank lines.
          sed -i '/./,$!d' NOTES.md
          awk 'NF{last=NR} {line[NR]=$0} END{for (i = 1; i <= last; i++) print line[i]}' NOTES.md > NOTES.trim
          mv NOTES.trim NOTES.md
          cat NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file NOTES.md --verify-tag
